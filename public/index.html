<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATC Approach Planner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23493D71' /><path d='M 50 50 L 85 25' stroke='%23EABFFF' stroke-width='4'/><circle cx='65' cy='70' r='5' fill='%23EABFFF' /></svg>">
    
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.5.0/maptiler-sdk.umd.min.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.5.0/maptiler-sdk.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --background-dark: #201838;
            --background-light: #493D71;
            --text-primary: #EAEAEA;
            --text-secondary: #A0A0A0;
            --accent: #EABFFF;
            --accent-glow: rgba(234, 191, 255, 0.25);
            --border-color: #544880;
            --danger-color: #dc3545;
            --departure-color: #e57373;
            --arrival-color: #64b5f6;
            --live-color: #28a745;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-dark);
            color: var(--text-primary);
        }

        #map { height: 100vh; width: 100%; }
        
        /* --- LOADER STYLES START --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--background-dark);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #loader img {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        #loader p {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        /* --- LOADER STYLES END --- */


        .reopen-button {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 999;
            background: rgba(32, 24, 56, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }
        .reopen-button:hover {
            background: var(--background-light);
        }


        .floating-panel {
            position: absolute;
            z-index: 1000;
            background: rgba(32, 24, 56, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 320px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 12px 15px;
            cursor: move;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0,0,0,0.2);
        }
        
        .panel-header img {
            height: 28px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
        }

        .panel-controls button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 2px 5px;
        }
        .panel-controls button:hover { color: var(--text-primary); }

        .panel-content {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            min-height: 0;
        }

        input[type="text"], input[type="number"], input[type="email"], textarea, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: var(--background-light);
            color: var(--text-primary);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        button, .button-link {
            padding: 10px 16px;
            background-color: var(--accent);
            color: var(--background-dark);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--accent-glow);
            text-decoration: none;
            text-align: center;
        }
        button:hover, .button-link:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 30px var(--accent-glow);
        }
        button:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #connect-live-btn { background-color: var(--accent); }
        
        .cta-button {
            padding: 8px 12px;
            font-size: 14px;
        }

        #airport-form { display: flex; gap: 8px; }

        .info-card { 
            margin-bottom: 15px; 
            background-color: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .info-card:last-child { margin-bottom: 0; }

        .info-card h3 { 
            font-size: 1.1rem; 
            margin: 0 0 8px 0; 
            padding-bottom: 8px; 
            border-bottom: 1px solid var(--border-color);
            color: var(--accent);
            font-weight: 700;
        }
        .info-card ul { list-style: none; padding: 0; margin: 0; font-size: 14px; color: var(--text-secondary);}
        .info-card ul li { padding: 4px 0; }
        .info-card ul li strong { color: var(--text-primary); font-weight: 500; }
        
        .plan-section { margin-bottom: 10px; }
        .plan-section-header {
            padding: 8px 12px;
            background-color: rgba(0,0,0,0.3);
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 5px;
            transition: background-color 0.2s;
        }
        .plan-section-header:hover { background-color: var(--background-light); }
        .plan-section-header.departure { border-left: 4px solid var(--departure-color); }
        .plan-section-header.arrival { border-left: 4px solid var(--arrival-color); }
        .plan-section-header.standard { border-left: 4px solid var(--text-primary); }
        .plan-section-content { display: none; padding-top: 5px; }


        .plan-step {
            background-color: var(--background-light);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }
        .plan-step-details { display: flex; justify-content: space-between; align-items: center; font-weight: 500; font-size: 14px;}
        .plan-step-inputs { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } 
        .plan-step-inputs > div { display: flex; flex-direction: column; }
        .plan-step-inputs label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        
        .delete-step-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-weight: bold; font-size: 16px; padding: 0 5px; }

        #msl-popup {
            position: absolute; display: none; background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(5px);
            color: #f5f5f5; padding: 5px 10px; border-radius: 5px; font-family: 'Roboto Mono', monospace;
            font-size: 12px; z-index: 2000; pointer-events: none;
        }
        .leaflet-marker-icon.custom-map-marker {
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
        }

        .drawing-temp-heading {
            color: #FFFFFF; font-family: 'Roboto Mono', monospace; font-size: 20px; font-weight: bold; white-space: nowrap;
            text-align: center; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000;
        }
        
        .flight-data-block {
            background: rgba(32, 24, 56, 0.9); backdrop-filter: blur(5px); border: 1px solid var(--border-color);
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); color: var(--text-primary); font-family: 'Roboto Mono', monospace;
            padding: 4px 6px; text-align: center; width: 90px; transform: translate(-50%, -50%); 
        }
        .fdb-heading { font-size: 16px; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 2px; margin-bottom: 3px; color: var(--accent);}
        .fdb-row { display: flex; justify-content: space-around; }

        .fdb-data-item { text-align: center; }
        .fdb-value { display: block; font-size: 14px; font-weight: 700; }
        .fdb-unit { display: block; font-size: 10px; color: var(--text-secondary); }
        
        .runway-label-halo {
            background-color: transparent; border: none; color: #FFFFFF; font-family: 'Inter', sans-serif;
            font-size: 16px; font-weight: bold; text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, -1.5px 0 0 #000, 1.5px 0 0 #000, 0 -1.5px 0 #000, 0 1.5px 0 #000;
            text-align: center; white-space: nowrap;
        }
        
        #line-type-selector > div { display: flex; justify-content: space-around; align-items: center; }
        #line-type-selector label { font-size: 14px; }
		
        /* --- Redesigned ATC List Styles --- */
#atc-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.atc-item {
    background-color: var(--background-light);
    border: 1px solid var(--border-color);
    border-radius: 12px; /* More rounded corners */
    padding: 16px;
    transition: background-color 0.2s ease, border-color 0.2s ease;
}
.atc-item:hover {
    border-color: var(--accent);
}

.atc-airport-header {
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
}

/* For the full airport name */
.atc-airport-header strong {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-primary);
    display: block;
    line-height: 1.2;
}

/* For the ICAO code below the name */
.atc-airport-header span {
    font-size: 0.9rem;
    font-family: 'Roboto Mono', monospace;
    color: var(--text-secondary);
}

.atc-frequency-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 12px; /* More space between frequencies */
}

.atc-frequency {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.atc-type {
    font-weight: 700;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 16px; /* Pill shape */
    color: #fff;
    text-transform: uppercase;
    flex-shrink: 0;
}

/* --- Frequency Type Colors --- */
.atc-type-ground { background-color: #E67E22; }      /* Orange */
.atc-type-tower { background-color: #3498DB; }       /* Blue */
.atc-type-atis { background-color: #9B59B6; }        /* Purple */
.atc-type-clearance { background-color: #1ABC9C; }  /* Turquoise */
.atc-type-approach { background-color: #2ECC71; }    /* Green */
.atc-type-departure { background-color: #27AE60; }   /* Darker Green */
.atc-type-center { background-color: #C0392B; }      /* Red */
.atc-type-unicom { background-color: #7F8C8D; }       /* Gray */


.atc-controller-info {
    text-align: right;
}

/* For the controller's username */
.atc-controller {
    font-family: 'Roboto Mono', monospace;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 500;
    display: block;
}

/* For the time on frequency */
.atc-duration {
    font-family: 'Roboto Mono', monospace;
    color: var(--text-secondary);
    font-size: 11px;
    display: block;
}

        /* --- END NEW ATC LIST STYLES --- */
        
        /* --- LIVE MODE INDICATOR --- */
        #live-status-indicator {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            transition: background-color 0.3s ease;
        }

        /* --- New Styles for Traffic Scan Results --- */
.traffic-card {
    background-color: #2c2f33; /* Dark background */
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    border-left: 4px solid var(--accent, #7289da);
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease;
    font-family: 'Inter', sans-serif;
}

.traffic-card:hover {
    background-color: #36393f;
    transform: translateY(-2px);
}

.traffic-card-header {
    margin-bottom: 16px;
}

.airport-name {
    font-size: 1.1em;
    font-weight: 600;
    color: #ffffff;
}

.airport-icao {
    font-size: 0.9em;
    color: #b9bbbe; /* Lighter gray for ICAO */
    font-family: 'Roboto Mono', monospace;
}

.traffic-card-body {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.traffic-col {
    width: 50%;
    text-align: center;
}

.col-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 0.8em;
    text-transform: uppercase;
    font-weight: 500;
    color: #8e9297; /* Subdued header color */
    margin-bottom: 8px;
}

.total-count {
    font-size: 2.2em;
    font-weight: 700;
    color: var(--accent, #7289da);
    line-height: 1;
}

.detail-breakdown {
    font-size: 0.8em;
    color: #b9bbbe;
    margin-top: 8px;
    line-height: 1.5;
}

.detail-value {
    font-weight: 600;
    color: #ffffff;
}

.on-ground-text {
    font-weight: 600;
    color: #ffffff;
}

/* Icons for Inbound/Outbound */
.icon-inbound, .icon-outbound {
    display: inline-block;
    width: 14px;
    height: 14px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

.icon-inbound {
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%238e9297" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m-7-7h14"/></svg>');
    transform: rotate(45deg);
}

.icon-outbound {
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238e9297"><path d="M2.5 19h19v2h-19v-2zm19.57-9.36c-.22-1.3-1.33-2.28-2.64-2.28-1.42 0-2.58 1.16-2.58 2.58s1.16 2.58 2.58 2.58c.28 0 .55-.05.81-.13l2.64 2.64v1.57h-8.58v-1.57l2.64-2.64c.25.09.52.13.81.13 1.42 0 2.58-1.16 2.58-2.58 0-.46-.13-.89-.35-1.28l1.76-1.76h1.57v3.43h2v-5h-4.36zM3.5 17.5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>');
}

/* Simple loading spinner */
.loader-dual-ring {
  display: block; /* Changed to block for centering */
  width: 40px;
  height: 40px;
  margin: 20px auto; /* Centering */
}
.loader-dual-ring:after {
  content: " ";
  display: block;
  width: 32px;
  height: 32px;
  margin: 4px; /* Adjusted margin */
  border-radius: 50%;
  border: 4px solid var(--text-primary);
  border-color: var(--text-primary) transparent var(--text-primary) transparent;
  animation: loader-dual-ring 1.2s linear infinite;
}
@keyframes loader-dual-ring {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
		
        /* --- CUSTOM POPUP STYLES --- */
        .maptiler-popup-content.custom-popup {
            /* Forcing background override because the default map style is too specific. */
            background: rgba(32, 24, 56, 0.9) !important;
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
            padding: 0; /* Remove default padding to use our own structure */
            width: 220px; /* Made smaller as requested */
            overflow: hidden; /* Important for border-radius to apply correctly to children */
        }

        .flight-popup-header {
            background-color: rgba(0,0,0,0.2);
            padding: 10px 12px; /* Adjusted for smaller size */
            border-bottom: 1px solid var(--border-color);
        }

        .flight-popup-callsign {
            font-size: 1rem; /* Adjusted for smaller size */
            font-weight: 700;
            color: var(--accent);
        }

        .flight-popup-aircraft {
            font-size: 0.75rem; /* Adjusted for smaller size */
            color: var(--text-secondary);
        }

        .flight-popup-body {
            padding: 12px; /* Adjusted for smaller size */
            display: flex;
            flex-direction: column;
            gap: 6px; /* Adjusted for smaller size */
        }

        .flight-popup-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px; /* Adjusted for smaller size */
        }

        .flight-popup-row .label {
            color: var(--text-secondary);
        }

        .flight-popup-row .value {
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
        }

        .flight-popup-footer {
            padding: 0 12px 12px 12px; /* Adjusted for smaller size */
        }

        .flight-popup-footer .cta-button {
             width: 100%;
             padding: 8px 12px;
             background-color: var(--accent);
             color: var(--background-dark);
             box-shadow: 0 0 20px var(--accent-glow);
             font-weight: 700;
        }
         .flight-popup-footer .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 30px var(--accent-glow);
        }

        /* Style the popup's pointer arrow to match the new dark theme */
        .maptiler-popup-anchor-bottom .maptiler-popup-tip {
            border-top-color: var(--border-color);
        }
        .maptiler-popup-anchor-top .maptiler-popup-tip {
            border-bottom-color: var(--border-color);
        }
        .maptiler-popup-anchor-left .maptiler-popup-tip {
            border-right-color: var(--border-color);
        }
        .maptiler-popup-anchor-right .maptiler-popup-tip {
            border-left-color: var(--border-color);
        }
		/* --- SPEED GUIDE TABLE STYLES --- */
.guide-header {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
    margin: 20px 0 8px 0;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border-color);
}

.speed-guide-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

.speed-guide-table th,
.speed-guide-table td {
    border: 1px solid var(--border-color);
    padding: 8px 12px;
    text-align: left;
}

.speed-guide-table th {
    background-color: var(--background-light);
    color: var(--accent);
    font-weight: 700;
}

.speed-guide-table td {
    color: var(--text-secondary);
}

.speed-guide-table td:first-child {
    font-family: 'Roboto Mono', monospace;
    font-weight: 500;
    color: var(--text-primary);
}

.guide-notes {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 10px;
    background-color: rgba(0, 0, 0, 0.2);
    padding: 8px;
    border-radius: 4px;
    border-left: 3px solid var(--accent);
}
    </style>
    
    <style>
        /* --- MOBILE RESPONSIVE STYLES --- */
        @media (max-width: 768px) {
            /* --- Panel Management --- */
            .floating-panel {
                /* Override floating behavior: make them full-width and dock them */
                width: 100% !important;
                max-width: 100% !important;
                height: 90vh !important; /* Use most of the screen height */
                max-height: 90vh !important;
                top: auto !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                border-radius: 15px 15px 0 0 !important; /* Rounded corners on top */
                border-width: 2px 0 0 0 !important;
                
                /* Hide panels by default, they will be toggled by buttons */
                transform: translateY(100%);
                transition: transform 0.3s ease-in-out;
            }

            .floating-panel.visible {
                /* Class to make a panel slide into view */
                transform: translateY(0);
            }

            .panel-header {
                /* Make header touch-friendly and not for dragging */
                cursor: default; 
            }

            /* --- Input and Button Sizing --- */
            button, .button-link, input[type="text"], input[type="number"], select {
                /* Make touch targets larger */
                padding: 14px;
                font-size: 16px;
            }

            /* --- Specific Panel Adjustments --- */
            #main-panel {
                /* The main panel is the primary interface */
                z-index: 1001;
            }

            #airport-info-panel, #live-control-panel, #settings-panel, #help-panel, #plan-panel {
                /* Other panels appear on top of the main one */
                z-index: 1002;
            }

            /* Hide the 'reopen' buttons on mobile, as we'll use a different system */
            .reopen-button {
                display: none !important;
            }
            
            /* Make popups on map slightly smaller */
            .maptiler-popup-content.custom-popup {
                width: 180px;
            }
        }
    </style>
</head>
<body>

    <div id="loader">
        <img src="image_4a1efb.png" alt="Virtual Vectors Logo">
        <p>Loading Assets...</p>
    </div>
    <div id="map"></div>
    <a href="#" id="reopen-main-panel" class="reopen-button" style="display: none;">Show Planner</a>
