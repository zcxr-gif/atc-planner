<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATC Approach Planner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23493D71' /><path d='M 50 50 L 85 25' stroke='%23EABFFF' stroke-width='4'/><circle cx='65' cy='70' r='5' fill='%23EABFFF' /></svg>">
    
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.5.0/maptiler-sdk.umd.min.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.5.0/maptiler-sdk.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --background-dark: #201838;
            --background-light: #493D71;
            --text-primary: #EAEAEA;
            --text-secondary: #A0A0A0;
            --accent: #EABFFF;
            --accent-glow: rgba(234, 191, 255, 0.25);
            --border-color: #544880;
            --danger-color: #dc3545;
            --departure-color: #e57373;
            --arrival-color: #64b5f6;
            --live-color: #28a745;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-dark);
            color: var(--text-primary);
        }

        #map { height: 100vh; width: 100%; }
        
        /* --- LOADER STYLES START --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--background-dark);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #loader img {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        #loader p {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        /* --- LOADER STYLES END --- */


        .reopen-button {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 999;
            background: rgba(32, 24, 56, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }
        .reopen-button:hover {
            background: var(--background-light);
        }


        .floating-panel {
            position: absolute;
            z-index: 1000;
            background: rgba(32, 24, 56, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 320px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 12px 15px;
            cursor: move;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0,0,0,0.2);
        }
        
        .panel-header img {
            height: 28px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
        }

        .panel-controls button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 2px 5px;
        }
        .panel-controls button:hover { color: var(--text-primary); }

        .panel-content {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            min-height: 0;
        }

        input[type="text"], input[type="number"], input[type="email"], textarea, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: var(--background-light);
            color: var(--text-primary);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        button, .button-link {
            padding: 10px 16px;
            background-color: var(--accent);
            color: var(--background-dark);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--accent-glow);
            text-decoration: none;
            text-align: center;
        }
        button:hover, .button-link:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 30px var(--accent-glow);
        }
        button:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #connect-live-btn { background-color: var(--accent); }
        
        .cta-button {
            padding: 8px 12px;
            font-size: 14px;
        }

        #airport-form { display: flex; gap: 8px; }

        .info-card { 
            margin-bottom: 15px; 
            background-color: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .info-card:last-child { margin-bottom: 0; }

        .info-card h3 { 
            font-size: 1.1rem; 
            margin: 0 0 8px 0; 
            padding-bottom: 8px; 
            border-bottom: 1px solid var(--border-color);
            color: var(--accent);
            font-weight: 700;
        }
        .info-card ul { list-style: none; padding: 0; margin: 0; font-size: 14px; color: var(--text-secondary);}
        .info-card ul li { padding: 4px 0; }
        .info-card ul li strong { color: var(--text-primary); font-weight: 500; }
        
        .plan-section { margin-bottom: 10px; }
        .plan-section-header {
            padding: 8px 12px;
            background-color: rgba(0,0,0,0.3);
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 5px;
            transition: background-color 0.2s;
        }
        .plan-section-header:hover { background-color: var(--background-light); }
        .plan-section-header.departure { border-left: 4px solid var(--departure-color); }
        .plan-section-header.arrival { border-left: 4px solid var(--arrival-color); }
        .plan-section-header.standard { border-left: 4px solid var(--text-primary); }
        .plan-section-content { display: none; padding-top: 5px; }


        .plan-step {
            background-color: var(--background-light);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }
        .plan-step-details { display: flex; justify-content: space-between; align-items: center; font-weight: 500; font-size: 14px;}
        .plan-step-inputs { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } 
        .plan-step-inputs > div { display: flex; flex-direction: column; }
        .plan-step-inputs label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        
        .delete-step-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-weight: bold; font-size: 16px; padding: 0 5px; }

        #msl-popup {
            position: absolute; display: none; background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(5px);
            color: #f5f5f5; padding: 5px 10px; border-radius: 5px; font-family: 'Roboto Mono', monospace;
            font-size: 12px; z-index: 2000; pointer-events: none;
        }
        .leaflet-marker-icon.custom-map-marker {
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
        }

        .drawing-temp-heading {
            color: #FFFFFF; font-family: 'Roboto Mono', monospace; font-size: 20px; font-weight: bold; white-space: nowrap;
            text-align: center; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000;
        }
        
        .flight-data-block {
            background: rgba(32, 24, 56, 0.9); backdrop-filter: blur(5px); border: 1px solid var(--border-color);
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); color: var(--text-primary); font-family: 'Roboto Mono', monospace;
            padding: 4px 6px; text-align: center; width: 90px; transform: translate(-50%, -50%); 
        }
        .fdb-heading { font-size: 16px; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 2px; margin-bottom: 3px; color: var(--accent);}
        .fdb-row { display: flex; justify-content: space-around; }

        .fdb-data-item { text-align: center; }
        .fdb-value { display: block; font-size: 14px; font-weight: 700; }
        .fdb-unit { display: block; font-size: 10px; color: var(--text-secondary); }
        
        .runway-label-halo {
            background-color: transparent; border: none; color: #FFFFFF; font-family: 'Inter', sans-serif;
            font-size: 16px; font-weight: bold; text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, -1.5px 0 0 #000, 1.5px 0 0 #000, 0 -1.5px 0 #000, 0 1.5px 0 #000;
            text-align: center; white-space: nowrap;
        }
        
        #line-type-selector > div { display: flex; justify-content: space-around; align-items: center; }
        #line-type-selector label { font-size: 14px; }
		
        /* --- NEW ATC LIST STYLES --- */
        #atc-list {
            display: flex;
            flex-direction: column;
            gap: 12px; /* Adds space between airport cards */
        }

        .atc-item {
            background-color: var(--background-light); 
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
        }

        .atc-airport-header {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .atc-airport-header strong {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent); /* Use accent color for the ICAO */
        }

        .atc-airport-header span {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: block; /* Puts the airport name on a new line */
        }

        .atc-frequency-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px; /* Adds space between frequency rows */
        }

        .atc-frequency {
            display: flex;
            justify-content: space-between; /* Aligns items to left and right */
            align-items: center;
            font-size: 14px;
        }

        .atc-type {
            font-weight: 500;
            color: var(--text-primary);
        }

        .atc-controller {
            font-family: 'Roboto Mono', monospace; 
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* Prettier scrollbar for the ATC list */
        #atc-list::-webkit-scrollbar {
            width: 6px;
        }
        #atc-list::-webkit-scrollbar-track {
            background: transparent;
        }
        #atc-list::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 6px;
        }
        #atc-list::-webkit-scrollbar-thumb:hover {
            background-color: var(--accent);
        }

        /* --- END NEW ATC LIST STYLES --- */
        
        /* --- LIVE MODE INDICATOR --- */
        #live-status-indicator {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            transition: background-color 0.3s ease;
        }
        
        /* --- NEW DROPDOWN STYLES --- */
        .filter-dropdown-container {
            position: relative; display: block; width: 100%; margin-bottom: 10px;
        }
        .filter-dropdown-btn {
            background-color: var(--background-light); color: var(--text-primary); padding: 10px 12px;
            font-size: 14px; font-weight: 500; border: 1px solid var(--border-color); cursor: pointer;
            width: 100%; text-align: left; border-radius: 6px; box-sizing: border-box;
        }
        .filter-dropdown-content {
            display: none; position: absolute; background-color: var(--background-dark);
            border: 1px solid var(--border-color); border-radius: 6px; width: 100%;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.3); z-index: 1001; padding: 12px; box-sizing: border-box;
        }
        .dropdown-description {
            font-size: 11px; color: var(--text-secondary); margin: 0 0 8px 0; padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
        }
        .filter-dropdown-content label {
            display: block; color: var(--text-primary); padding: 5px 0; font-weight: normal; cursor: pointer;
        }
		
        /* --- CUSTOM POPUP STYLES --- */
        .maptiler-popup-content.custom-popup {
            /* Forcing background override because the default map style is too specific. */
            background: rgba(32, 24, 56, 0.9) !important;
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
            padding: 0; /* Remove default padding to use our own structure */
            width: 220px; /* Made smaller as requested */
            overflow: hidden; /* Important for border-radius to apply correctly to children */
        }

        .flight-popup-header {
            background-color: rgba(0,0,0,0.2);
            padding: 10px 12px; /* Adjusted for smaller size */
            border-bottom: 1px solid var(--border-color);
        }

        .flight-popup-callsign {
            font-size: 1rem; /* Adjusted for smaller size */
            font-weight: 700;
            color: var(--accent);
        }

        .flight-popup-aircraft {
            font-size: 0.75rem; /* Adjusted for smaller size */
            color: var(--text-secondary);
        }

        .flight-popup-body {
            padding: 12px; /* Adjusted for smaller size */
            display: flex;
            flex-direction: column;
            gap: 6px; /* Adjusted for smaller size */
        }

        .flight-popup-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px; /* Adjusted for smaller size */
        }

        .flight-popup-row .label {
            color: var(--text-secondary);
        }

        .flight-popup-row .value {
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
        }

        .flight-popup-footer {
            padding: 0 12px 12px 12px; /* Adjusted for smaller size */
        }

        .flight-popup-footer .cta-button {
             width: 100%;
             padding: 8px 12px;
             background-color: var(--accent);
             color: var(--background-dark);
             box-shadow: 0 0 20px var(--accent-glow);
             font-weight: 700;
        }
         .flight-popup-footer .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 30px var(--accent-glow);
        }

        /* Style the popup's pointer arrow to match the new dark theme */
        .maptiler-popup-anchor-bottom .maptiler-popup-tip {
            border-top-color: var(--border-color);
        }
        .maptiler-popup-anchor-top .maptiler-popup-tip {
            border-bottom-color: var(--border-color);
        }
        .maptiler-popup-anchor-left .maptiler-popup-tip {
            border-right-color: var(--border-color);
        }
        .maptiler-popup-anchor-right .maptiler-popup-tip {
            border-left-color: var(--border-color);
        }
        
        /* --- ATC Airport Marker on Map --- */
        .atc-airport-marker {
            width: 16px;
            height: 16px;
            background-color: var(--accent);
            border: 2px solid #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 0 10px 3px var(--accent-glow);
            cursor: pointer;
            animation: pulse-atc 2s infinite;
        }

        @keyframes pulse-atc {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 var(--accent-glow);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 10px 10px rgba(234, 191, 255, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(234, 191, 255, 0);
            }
        }

        /* --- ATC Popup Styles --- */
        .maptiler-popup-content.atc-popup {
            width: 200px; /* Slightly smaller than flight popups */
        }

        .atc-popup-header {
            background-color: rgba(0,0,0,0.2);
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .atc-popup-icao {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .atc-popup-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: block; /* Puts the airport name on a new line */
        }

        .atc-popup-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
        }

        .atc-popup-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .atc-popup-type {
            font-weight: 500;
            color: var(--text-primary);
        }

        .atc-popup-freq {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }

    </style>
</head>
<body>

    <div id="loader">
        <img src="image_4a1efb.png" alt="Virtual Vectors Logo">
        <p>Loading Assets...</p>
    </div>
    <div id="map"></div>
    <a href="#" id="reopen-main-panel" class="reopen-button" style="display: none;">Show Planner</a>
    <div id="msl-popup"></div>

    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-dragdata@2.2.3/dist/chartjs-plugin-dragdata.min.js"></script>
    
    <script src="geomag.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
