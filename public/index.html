<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATC Approach Planner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%232c3e50' /><path d='M 50 50 L 85 25' stroke='%233498db' stroke-width='4'/><circle cx='65' cy='70' r='5' fill='%233498db' /></svg>">
    
    <script>
      var process = {
        env: {
          NODE_ENV: 'development'
        }
      };
    </script>

    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.5.0/maptiler-sdk.umd.min.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.5.0/maptiler-sdk.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --background-dark: #1e272e;
            --background-panel: #243038;
            --background-light: #2c3a47;
            --text-primary: #ecf0f1;
            --text-secondary: #bdc3c7;
            --accent-primary: #3498db;
            --accent-secondary: #f39c12;
            --accent-glow: rgba(52, 152, 219, 0.2);
            --border-color: #4a6375;
            --danger-color: #e74c3c;
            --departure-color: #e67e22;
            --arrival-color: #2980b9;
            --live-color: #27ae60;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-dark);
            color: var(--text-primary);
        }

        #map { height: 100vh; width: 100%; }
        
        /* --- LOADER STYLES START --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--background-dark);
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #loader.hidden { opacity: 0; visibility: hidden; }
        #loader img {
            width: 150px; height: auto; margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        #loader p { font-size: 1.1rem; font-weight: 500; color: var(--text-secondary); }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        /* --- LOADER STYLES END --- */

        .reopen-button {
            position: absolute; top: 10px; left: 10px; z-index: 999;
            background: rgba(36, 48, 56, 0.85); backdrop-filter: blur(10px);
            color: var(--text-primary); padding: 8px 12px;
            border-radius: 8px; border: 1px solid var(--border-color);
            cursor: pointer; font-size: 14px; font-weight: 500; text-decoration: none;
            transition: background-color 0.2s ease;
        }
        .reopen-button:hover { background: var(--background-light); }

        .floating-panel {
            position: absolute; z-index: 1000;
            background: rgba(36, 48, 56, 0.9); backdrop-filter: blur(15px);
            border-radius: 12px; border: 1px solid var(--border-color);
            color: var(--text-primary); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 340px; max-height: 90vh; display: flex; flex-direction: column;
        }

        .panel-header {
            padding: 10px 15px; cursor: move; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            background-color: rgba(0,0,0,0.25);
        }
        .panel-header img { height: 28px; }
        .panel-header h2 {
            margin: 0; font-size: 1rem; font-weight: 700;
            color: var(--text-primary);
        }

        .panel-controls button {
            background: none; border: none; color: var(--text-secondary);
            font-size: 18px; cursor: pointer; padding: 2px 5px;
        }
        .panel-controls button:hover { color: var(--accent-primary); }

        .panel-content { padding: 15px; overflow-y: auto; flex-grow: 1; min-height: 0; }

        input[type="text"], input[type="number"], input[type="email"], textarea, select {
            width: 100%; padding: 10px 12px;
            border: 1px solid var(--border-color); border-radius: 6px;
            font-size: 14px; background-color: var(--background-light);
            color: var(--text-primary); box-sizing: border-box;
            font-family: 'Inter', sans-serif; transition: border-color 0.2s ease;
        }
        input:focus, select:focus { border-color: var(--accent-primary); outline: none; }

        button, .button-link {
            padding: 10px 16px; background-color: var(--accent-primary);
            color: #fff; border: none; border-radius: 8px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 2px 10px var(--accent-glow);
            text-decoration: none; text-align: center;
        }
        button:hover, .button-link:hover {
            transform: translateY(-1px);
            background-color: #4aa3df;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        button:disabled {
            background-color: #555; color: #999;
            cursor: not-allowed; box-shadow: none; transform: none;
        }
        #connect-live-btn { background-color: var(--accent-primary); }
        .cta-button { padding: 8px 12px; font-size: 14px; }

        #airport-form { display: flex; gap: 8px; }

        .info-card { 
            margin-bottom: 15px; background-color: var(--background-panel);
            padding: 1rem; border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .info-card:last-child { margin-bottom: 0; }
        .info-card h3 { 
            font-size: 1rem; margin: 0 0 12px 0; padding-bottom: 8px; 
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-secondary); font-weight: 600; text-transform: uppercase;
        }
        .info-card ul { list-style: none; padding: 0; margin: 0; font-size: 14px; color: var(--text-secondary); }
        .info-card ul li { padding: 5px 0; display: flex; justify-content: space-between; }
        .info-card ul li strong { color: var(--text-primary); font-weight: 500; }
        
        .plan-section { margin-bottom: 10px; }
        .plan-section-header {
            padding: 10px 14px; background-color: rgba(0,0,0,0.3);
            cursor: pointer; border-radius: 6px; font-weight: 600;
            margin-bottom: 5px; transition: background-color 0.2s;
            display: flex; align-items: center;
        }
        .plan-section-header:hover { background-color: var(--background-light); }
        .plan-section-header.departure { border-left: 4px solid var(--departure-color); }
        .plan-section-header.arrival { border-left: 4px solid var(--arrival-color); }
        .plan-section-header.standard { border-left: 4px solid var(--text-primary); }
        .plan-section-content { display: none; padding-top: 5px; }

        .plan-step {
            background-color: var(--background-light); border-radius: 6px; padding: 12px;
            margin-bottom: 8px; border: 1px solid var(--border-color);
        }
        .plan-step-details { display: flex; justify-content: space-between; align-items: center; font-weight: 500; font-size: 14px;}
        .plan-step-inputs { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } 
        .plan-step-inputs > div { display: flex; flex-direction: column; }
        .plan-step-inputs label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .delete-step-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-weight: bold; font-size: 16px; padding: 0 5px; }

        #msl-popup {
            position: absolute; display: none; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(5px);
            color: #f5f5f5; padding: 6px 12px; border-radius: 5px; font-family: 'Roboto Mono', monospace;
            font-size: 13px; z-index: 2000; pointer-events: none; border: 1px solid var(--border-color);
        }

        .drawing-temp-heading {
            color: #FFFFFF; font-family: 'Roboto Mono', monospace; font-size: 20px; font-weight: bold; white-space: nowrap;
            text-align: center; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }
        
        .flight-data-block {
            background: rgba(36, 48, 56, 0.9); backdrop-filter: blur(5px); border: 1px solid var(--border-color);
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); color: var(--text-primary); font-family: 'Roboto Mono', monospace;
            padding: 4px 6px; text-align: center; width: 90px; transform: translate(-50%, -50%); 
        }
        .fdb-heading { font-size: 16px; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 2px; margin-bottom: 3px; color: var(--accent-secondary);}
        .fdb-row { display: flex; justify-content: space-around; }
        .fdb-data-item { text-align: center; }
        .fdb-value { display: block; font-size: 14px; font-weight: 700; }
        .fdb-unit { display: block; font-size: 10px; color: var(--text-secondary); }
        
        .runway-label-halo {
            background-color: transparent; border: none; color: #FFFFFF; font-family: 'Inter', sans-serif;
            font-size: 16px; font-weight: bold; text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
            text-align: center; white-space: nowrap;
        }

        /* --- ATC LIST STYLES --- */
        #atc-list { display: flex; flex-direction: column; gap: 12px; }
        .atc-item {
            background-color: var(--background-light); border-radius: 8px; padding: 16px;
            border-left: 4px solid var(--accent-primary); transition: background-color 0.2s ease;
            border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        .atc-item:hover { background-color: var(--background-panel); }
        .atc-airport-header { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .atc-airport-header strong { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); display: block; line-height: 1.2; }
        .atc-airport-header span { font-size: 0.9rem; font-family: 'Roboto Mono', monospace; color: var(--text-secondary); }
        .atc-frequency-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
        .atc-frequency { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
        .atc-type {
            font-weight: 700; font-size: 11px; padding: 4px 10px; border-radius: 16px; color: #fff;
            text-transform: uppercase; flex-shrink: 0; margin-top: 2px;
        }
        /* --- Frequency Type Colors --- */
        .atc-type-ground { background-color: #E67E22; }      /* Orange */
        .atc-type-tower { background-color: #3498DB; }       /* Blue */
        .atc-type-atis { background-color: #9B59B6; }        /* Purple */
        .atc-type-clearance { background-color: #1ABC9C; }  /* Turquoise */
        .atc-type-approach { background-color: #2ECC71; }    /* Green */
        .atc-type-departure { background-color: #27AE60; }   /* Darker Green */
        .atc-type-center { background-color: #C0392B; }      /* Red */
        .atc-type-unicom { background-color: #7F8C8D; }       /* Gray */
        .atc-controller-info { text-align: left; min-width: 0; }
        .atc-controller {
            font-family: 'Roboto Mono', monospace; color: var(--text-primary); font-size: 14px; font-weight: 500;
            display: block; white-space: normal; word-break: break-word;
        }
        .atc-duration { font-family: 'Roboto Mono', monospace; color: var(--text-secondary); font-size: 11px; display: block; margin-top: 2px; }
        
        #live-status-indicator {
            padding: 4px 12px; border-radius: 12px; font-size: 12px;
            font-weight: 700; color: #fff; transition: background-color 0.3s ease;
        }
        
        /* --- Styles for Filter Dropdown Buttons --- */
        .filter-dropdown-container { margin-bottom: 12px; }
        .filter-dropdown-btn {
            width: 100%; background-color: var(--background-light); color: var(--text-primary);
            border: 1px solid var(--border-color); padding: 10px 12px; text-align: left;
            font-size: 14px; font-weight: 500;
            box-shadow: none; display: flex; justify-content: space-between; align-items: center;
        }
        .filter-dropdown-btn:hover {
            border-color: var(--accent-primary); background-color: var(--background-panel);
            transform: none;
        }
        .filter-dropdown-content {
            padding: 12px; background-color: var(--background-panel);
            border: 1px solid var(--border-color); border-top: none;
            border-radius: 0 0 6px 6px;
        }
        .dropdown-description {
            font-size: 12px; color: var(--text-secondary); margin: 0 0 10px 0;
            padding-bottom: 8px; border-bottom: 1px solid var(--border-color);
        }
        #airport-filters label, #navigation-filters label {
            display: block; margin-bottom: 8px; font-size: 14px; cursor: pointer;
        }
        #airport-filters input, #navigation-filters input { margin-right: 8px; }

        /* --- Traffic Scan Results --- */
        .traffic-card {
            background-color: var(--background-light); border-radius: 8px; padding: 16px; margin-bottom: 12px;
            border-left: 4px solid var(--accent-primary); cursor: pointer; transition: all 0.2s ease;
        }
        .traffic-card:hover { background-color: var(--background-panel); transform: translateY(-2px); border-left-color: var(--accent-secondary); }
        .traffic-card-header { margin-bottom: 16px; }
        .airport-name { font-size: 1.2em; font-weight: 700; color: #ffffff; }
        .airport-icao { font-size: 0.9em; color: var(--text-secondary); font-family: 'Roboto Mono', monospace; }
        .traffic-card-body { display: flex; justify-content: space-between; gap: 15px; }
        .traffic-col { width: 50%; text-align: center; }
        .col-header {
            display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.8em;
            text-transform: uppercase; font-weight: 500; color: #8e9297; margin-bottom: 8px;
        }
        .total-count { font-size: 2.4em; font-weight: 800; color: var(--accent-primary); line-height: 1; }
        .traffic-col:last-child .total-count { color: var(--accent-secondary); }
        .detail-breakdown { font-size: 0.85em; color: var(--text-secondary); margin-top: 8px; line-height: 1.5; display: flex; flex-direction: column; }
        .detail-value { font-weight: 600; color: #ffffff; }
        .icon-inbound, .icon-outbound {
            display: inline-block; width: 14px; height: 14px; background-size: contain;
            background-repeat: no-repeat; background-position: center;
        }
        .icon-inbound { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%238e9297" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m-7-7h14"/></svg>'); transform: rotate(45deg); }
        .icon-outbound { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238e9297"><path d="M2.5 19h19v2h-19v-2zm19.57-9.36c-.22-1.3-1.33-2.28-2.64-2.28-1.42 0-2.58 1.16-2.58 2.58s1.16 2.58 2.58 2.58c.28 0 .55-.05.81-.13l2.64 2.64v1.57h-8.58v-1.57l2.64-2.64c.25.09.52.13.81.13 1.42 0 2.58-1.16 2.58-2.58 0-.46-.13-.89-.35-1.28l1.76-1.76h1.57v3.43h2v-5h-4.36zM3.5 17.5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>'); }

        .loader-dual-ring { display: block; width: 40px; height: 40px; margin: 20px auto; }
        .loader-dual-ring:after {
            content: " "; display: block; width: 32px; height: 32px; margin: 4px; border-radius: 50%;
            border: 4px solid var(--text-primary); border-color: var(--text-primary) transparent var(--text-primary) transparent;
            animation: loader-dual-ring 1.2s linear infinite;
        }
        @keyframes loader-dual-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .traffic-card-frequencies {
            margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-color);
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .freq-bubble {
            display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
            border-radius: 50%; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 13px;
            color: #fff; text-transform: uppercase;
        }
        .freq-type-ground { background-color: #E67E22; }
        .freq-type-tower { background-color: #3498DB; }
        .freq-type-atis { background-color: #9B59B6; }
        .freq-type-approach { background-color: #2ECC71; }
        .freq-type-departure { background-color: #27AE60; }
		
        /* --- CUSTOM POPUP STYLES --- */
        .maptiler-popup-content.custom-popup {
            background: rgba(36, 48, 56, 0.9) !important; backdrop-filter: blur(10px);
            color: var(--text-primary); border-radius: 12px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid var(--border-color); font-family: 'Inter', sans-serif;
            padding: 0; width: 240px; overflow: hidden;
        }
        .flight-popup-header {
            background-color: rgba(0,0,0,0.2); padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
        }
        .flight-popup-callsign { font-size: 1.1rem; font-weight: 700; color: var(--accent-primary); }
        .flight-popup-aircraft { font-size: 0.8rem; color: var(--text-secondary); }
        .flight-popup-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
        .flight-popup-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .flight-popup-row .label { color: var(--text-secondary); }
        .flight-popup-row .value { font-family: 'Roboto Mono', monospace; font-weight: 500; }
        .flight-popup-footer { padding: 0 12px 12px 12px; }
        .flight-popup-footer .cta-button {
             width: 100%; padding: 8px 12px; background-color: var(--accent-secondary);
             color: var(--background-dark); box-shadow: 0 0 20px rgba(243, 156, 18, 0.25); font-weight: 700;
        }
        .flight-popup-footer .cta-button:hover { transform: translateY(-2px); box-shadow: 0 4px 30px rgba(243, 156, 18, 0.3); }

        .maptiler-popup-anchor-bottom .maptiler-popup-tip { border-top-color: var(--border-color); }
        .maptiler-popup-anchor-top .maptiler-popup-tip { border-bottom-color: var(--border-color); }
        .maptiler-popup-anchor-left .maptiler-popup-tip { border-right-color: var(--border-color); }
        .maptiler-popup-anchor-right .maptiler-popup-tip { border-left-color: var(--border-color); }

        /* --- SPEED GUIDE TABLE STYLES --- */
        .guide-header {
            font-size: 1rem; font-weight: 600; color: var(--text-primary);
            margin: 20px 0 10px 0; padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .speed-guide-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .speed-guide-table th, .speed-guide-table td {
            border: 1px solid var(--border-color); padding: 8px 12px; text-align: left;
        }
        .speed-guide-table th { background-color: var(--background-light); color: var(--accent-secondary); font-weight: 600; }
        .speed-guide-table td { color: var(--text-secondary); }
        .speed-guide-table td:first-child { font-family: 'Roboto Mono', monospace; font-weight: 500; color: var(--text-primary); }
        .guide-notes {
            font-size: 12px; color: var(--text-secondary); margin-top: 10px;
            background-color: var(--background-panel); padding: 10px; border-radius: 4px;
            border-left: 3px solid var(--accent-secondary);
        }

        /* --- CUSTOM SCROLLBAR STYLES --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--background-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
    </style>
    
    <style>
        /* --- MOBILE RESPONSIVE STYLES --- */
        @media (max-width: 768px) {
            .floating-panel {
                width: 100% !important; max-width: 100% !important; height: 90vh !important;
                max-height: 90vh !important; top: auto !important; left: 0 !important;
                right: 0 !important; bottom: 0 !important; border-radius: 15px 15px 0 0 !important;
                border-width: 2px 0 0 0 !important; transform: translateY(100%);
                transition: transform 0.3s ease-in-out;
            }
            .floating-panel.visible { transform: translateY(0); }
            .panel-header { cursor: default; }

            button, .button-link, input[type="text"], input[type="number"], select { padding: 14px; font-size: 16px; }
            #main-panel { z-index: 1001; }
            #airport-info-panel, #live-control-panel, #settings-panel, #help-panel, #plan-panel { z-index: 1002; }
            .reopen-button { display: none !important; }
            .maptiler-popup-content.custom-popup { width: 200px; }
            #mobile-nav-live img { width: 36px; height: 24px; }
			#mobile-nav {
                display: flex; position: fixed; bottom: 0; left: 0; right: 0;
                height: 65px; background: rgba(36, 48, 56, 0.95);
                backdrop-filter: blur(15px); border-top: 1px solid var(--border-color);
                z-index: 1010; justify-content: space-around; align-items: flex-start;
                padding-top: 8px;
            }
            .mobile-nav-btn {
                display: flex; flex-direction: column; align-items: center; background: none;
                border: none; color: var(--text-secondary); font-size: 11px;
                font-family: 'Inter', sans-serif; padding: 0 5px; cursor: pointer;
                transition: color 0.2s ease; flex-grow: 1; box-shadow: none;
            }
            .mobile-nav-btn:hover { transform: none; color: var(--text-primary); }
            .mobile-nav-btn.active { color: var(--accent-primary); }
            .mobile-nav-btn svg, .mobile-nav-btn img {
                width: 28px; height: 28px; margin-bottom: 4px;
                object-fit: contain; transition: transform 0.2s ease, opacity 0.2s ease;
            }
            .mobile-nav-btn:not(.active) img { opacity: 0.6; }
            .mobile-nav-btn.active img { opacity: 1; transform: scale(1.1); }
            .floating-panel {
                bottom: 65px !important; height: auto !important;
                max-height: 75vh !important; border-width: 1px 0 0 0 !important;
            }
            .desktop-tool-buttons { display: none; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <img src="image_4a1efb.png" alt="Virtual Vectors Logo">
